[project]
name = "strom-agent"
version = "0.1.0"
description = "A small, transparent LLM agent for German DE-LU day-ahead electricity prices."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.16.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
strom-agent = "strom_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets the tests import evals/run_evals.py, which lives outside the package.
pythonpath = ["."]
